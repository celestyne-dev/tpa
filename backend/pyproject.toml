[project]
name = "tpa-backend"
version = "0.2.0"
description = "Think Positive Always — Flask API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long, explicit HTTP assertions read better unwrapped in tests.
"tests/*" = ["E501"]
